name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test guided solve, replay, bot model and English UI
        run: node --test tests/guided-solver.test.cjs tests/solve-replay.test.cjs tests/ui-language.test.cjs tests/bot-model.test.cjs tests/rating-display.test.cjs tests/battle-moment.test.cjs tests/online-battle-page.test.cjs tests/profile-records.test.cjs tests/profile-progress.test.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp \
            about.html \
            cube-net.js \
            cube.js \
            firebase-config.js \
            game-ui.css \
            game-ui.js \
            guided-solver.js \
            guided-solve.js \
            solve-replay.js \
            daily-challenge.js \
            bot-model.js \
            bot-battle.js \
            bot-calibration.json \
            index.html \
            manifest.json \
            online.js \
            profile-records.js \
            profile-progress.js \
            profile-view.js \
            opponent-cube.js \
            privacy.html \
            robots.txt \
            rules.html \
            scramble.js \
            script.js \
            service-worker.js \
            sitemap.xml \
            style.css \
            timer.js \
            _site/
          cp -R images _site/images
          cp -R online-battle _site/online-battle
          touch _site/.nojekyll
          echo "Files: $(find _site -type f | wc -l)"
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
